# Render's free plan puts the API to sleep after 15 minutes without traffic,
# and the first request after that takes up to a minute. Pinging /health
# every 10 minutes keeps it awake.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            --max-time 90 https://corecheck-api-kahf.onrender.com/health
